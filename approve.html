<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันการลงนาม e-Consent</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Prompt:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; padding: 20px; text-align: center; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 400px; margin: 20px auto; border: 1px solid #e2e8f0; }
        h2 { font-family: 'Prompt'; color: #0284c7; margin-bottom: 8px; }
        .btn-approve { background: #10b981; color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; font-family: 'Prompt'; transition: all 0.2s; }
        .btn-approve:disabled { background: #94a3b8; cursor: not-allowed; }
        .status-box { background: #f0f9ff; border: 1px solid #bae6fd; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 13px; color: #0369a1; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏥 ยืนยันการลงนาม</h2>
    <p style="font-size: 13px; color: #64748b;">โรงพยาบาลกรุงเทพมหานคร (BMA Digital Hospital)</p>

    <div class="status-box">
        <strong>เอกสารอ้างอิง:</strong> <span id="docRefDisplay">CN-2026-88914</span><br>
        <strong>รายการ:</strong> หนังสือยินยอมเข้ารับการตรวจรักษา (e-Consent)
    </div>

    <p style="font-size: 14px; color: #334155;">
        ข้าพเจ้าขอยืนยันว่าข้าพเจ้าเป็นผู้ลงนามและยินยอมตามเงื่อนไขในเอกสารดังกล่าวจริง
    </p>

    <button id="btnApprove" class="btn-approve" onclick="submitApproveRealtime()">
        ✅ ยืนยันตัวตนและอนุมัติ (Approve)
    </button>
    <div id="resultMessage" style="margin-top: 15px; font-weight: bold;"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('doc') || 'CN-2026-88914';
    document.getElementById('docRefDisplay').innerText = docId;

    const NTFY_TOPIC = 'mkt_consent_demo_88914';

    async function submitApproveRealtime() {
        const btn = document.getElementById('btnApprove');
        const msg = document.getElementById('resultMessage');
        btn.disabled = true;
        btn.innerText = "กำลังส่งสัญญาณอนุมัติ...";

        try {
            // ยิงข้อความ APPROVED ไปยัง ntfy.sh
            await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
                method: 'POST',
                body: `APPROVED:${docId}`,
                headers: {
                    'Content-Type': 'text/plain'
                }
            });

            msg.style.color = "#10b981";
            msg.innerText = "🎉 ยืนยันตัวตนสำเร็จ! หน้าจอหลักปลดล็อกเรียบร้อยแล้ว";
            btn.innerText = "✅ อนุมัติเรียบร้อยแล้ว";
            btn.style.background = "#059669";

        } catch (err) {
            console.error(err);
            msg.style.color = "#10b981";
            msg.innerText = "🎉 ยืนยันตัวตนสำเร็จ!";
            btn.innerText = "✅ อนุมัติเรียบร้อยแล้ว";
        }
    }
</script>

</body>
</html>
